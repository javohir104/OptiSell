<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#059669" />
    <meta name="format-detection" content="telephone=no" />
    <!-- Telegram Mini App SDK (does nothing in a normal browser) -->
    <script src="https://telegram.org/js/telegram-web-app.js?59"></script>
    <meta name="description" content="OptiSell — AI-powered sales, inventory and profit analytics for small businesses." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>OptiSell</title>
    <script>
      try {
        var t = localStorage.getItem('optisell_theme');
        var tw = window.Telegram && window.Telegram.WebApp;
        var tgDark = tw && tw.initData ? tw.colorScheme === 'dark' : null;
        if (t === 'dark' || (!t && (tgDark !== null ? tgDark : window.matchMedia('(prefers-color-scheme: dark)').matches))) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
